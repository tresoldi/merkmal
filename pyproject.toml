[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merkmal"
version = "1.0.0"
description = "Standalone phonological feature systems for historical linguistics"
authors = [
    {name = "Tiago Tresoldi", email = "tiago.tresoldi@lingfil.uu.se"}
]
# The wheel embeds the generated built-in tables. They are attribution-bound
# rather than MIT: CLTS-derived models are CC-BY-4.0, PHOIBLE is CC-BY-SA-3.0,
# and P-base models are CC-BY-NC-SA-4.0. Declaring the distribution as MIT
# alone would misstate it. See NOTICE.
license = "MIT AND CC-BY-4.0 AND CC-BY-SA-3.0 AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "NOTICE"]
readme = "python/README.md"
requires-python = ">=3.12"
keywords = [
    "phonology",
    "phonological features",
    "historical linguistics",
    "sequence alignment",
    "cognate detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy", "build"]

[project.scripts]
merkmal = "merkmal.cli:main"

[project.urls]
Homepage = "https://github.com/tresoldi/merkmal"
Documentation = "https://github.com/tresoldi/merkmal#readme"
Repository = "https://github.com/tresoldi/merkmal"
"Bug Tracker" = "https://github.com/tresoldi/merkmal/issues"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["merkmal*"]

[tool.setuptools.package-data]
merkmal = [
    "py.typed",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
"tools/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["merkmal"]
omit = ["*/tests/*", "*/test_*"]

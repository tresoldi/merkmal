name: Wheels

# Builds the release artifacts. The extension uses the CPython Limited API
# (cp312-abi3), so one wheel per platform serves every CPython from 3.12, and
# since normalization is compiled in there is no system library to provide.
#
# merkmal is published as one package, built with every bundled table. Users
# who need a build without PHOIBLE and P-base compile it themselves with
# MERKMAL_DATA_PROFILE=cc-by; see docs/distribution.md.
#
# Each runner builds its native architecture only: x86_64 and aarch64 Linux
# (manylinux and musllinux) and arm64 macOS. Intel macOS has no current runner
# image; those users build from the sdist, which needs no system library.
#
# Publishing uses PyPI trusted publishing: before the first tag, create the
# environment `pypi` here and a trusted publisher for this workflow on PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS: native
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

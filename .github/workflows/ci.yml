name: CI

on:
  push:
  pull_request:

jobs:
  c:
    name: C build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libutf8proc-dev
      - name: Configure
        run: >
          cmake -S . -B build/c-debug
          -DCMAKE_BUILD_TYPE=Debug
          -DMERKMAL_REQUIRE_UTF8PROC=ON
          -DMERKMAL_WERROR=ON
      - name: Build
        run: cmake --build build/c-debug
      - name: Test
        run: ctest --test-dir build/c-debug --output-on-failure
      - name: Check generated data
        run: cmake --build build/c-debug --target check-generated-data
      - name: Header compiles standalone, in C99 and in C++
        # The ctest case covers C. This adds C++, which is what the header's
        # extern "C" block exists for and which nothing else here compiles.
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude -c tests/c/header/header_only.cpp -o /dev/null
      - name: Install
        run: cmake --install build/c-debug --prefix "$GITHUB_WORKSPACE/build/install"
      - name: Test installed CMake package
        run: |
          cmake -S tests/c/install_consumer -B build/install-consumer \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/install"
          cmake --build build/install-consumer
          ctest --test-dir build/install-consumer --output-on-failure
      - name: Test installed pkg-config package
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/build/install/lib/pkgconfig:$GITHUB_WORKSPACE/build/install/lib64/pkgconfig"
          # The default CMake build installs a static library, so include private utf8proc.
          cc tests/c/install_consumer/main.c $(pkg-config --static --cflags --libs merkmal) -o build/pkg-config-consumer
          build/pkg-config-consumer

  c-fallback:
    name: C fallback Unicode path
    # MK_HAVE_UTF8PROC=0 is the profile WebAssembly ships. It was previously
    # built only by the wasm job and exercised by a single smoke program; this
    # runs the whole suite against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
      - name: Configure
        run: >
          cmake -S . -B build/c-fallback
          -DCMAKE_BUILD_TYPE=Debug
          -DMERKMAL_USE_UTF8PROC=OFF
          -DMERKMAL_WERROR=ON
      - name: Build
        run: cmake --build build/c-fallback
      - name: Test
        run: ctest --test-dir build/c-fallback --output-on-failure

  c-footprint:
    name: Compiled footprint
    # Reports only. The numbers exist so that data-representation changes can
    # be argued from measurements rather than from intent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Measure
        run: bench/bench_footprint.sh build/footprint
      - name: Show the committed baseline
        run: cat bench/baseline.txt

  c-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Analyze
        run: scripts/run_static_analysis.sh | tee analysis.txt
      - name: Fail on a new finding
        # The script filters the accepted findings it documents, so anything
        # left is new.
        run: |
          if grep -E 'warning:|error:' analysis.txt; then
            echo "static analysis reported a new finding" >&2
            exit 1
          fi

  c-fuzz:
    name: Fuzz smoke
    # Time-boxed, so this is a check that the harnesses still build and that the
    # seed corpora survive a short run -- not a campaign. Longer runs are a
    # manual job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang
      - name: Configure
        run: >
          CC=clang cmake -S . -B build/fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DMERKMAL_USE_UTF8PROC=OFF
          -DMERKMAL_BUILD_TESTS=OFF
          -DMERKMAL_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build/fuzz
      - name: Fuzz each entry point
        run: |
          for target in model_text segment resolve; do
            ./build/fuzz/fuzz_$target fuzz/corpus/$target \
              -max_total_time=60 -max_len=4096 -print_final_stats=1
          done

  c-sanitizers:
    name: C sanitizers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libutf8proc-dev
      - name: Configure
        run: >
          cmake -S . -B build/c-sanitizer
          -DCMAKE_BUILD_TYPE=Debug
          -DMERKMAL_REQUIRE_UTF8PROC=ON
          -DMERKMAL_WERROR=ON
          -DMERKMAL_ENABLE_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build/c-sanitizer
      - name: Test
        run: ctest --test-dir build/c-sanitizer --output-on-failure

  c-shared:
    name: Shared C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libutf8proc-dev
      - name: Configure
        run: >
          cmake -S . -B build/c-shared
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DMERKMAL_REQUIRE_UTF8PROC=ON
          -DMERKMAL_WERROR=ON
      - name: Build
        run: cmake --build build/c-shared
      - name: Test
        run: ctest --test-dir build/c-shared --output-on-failure

  python:
    name: Python wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libutf8proc-dev
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest python/tests -q
      - name: Test the data generator
        run: python -m pytest tools/tests -q
      - name: Validate model data, geometry, and provenance
        run: python scripts/validate_models.py
      - name: Check the contrast baseline
        # Fails on an undeclared zero-distance pair or a label that cannot
        # affect any distance. Both are how contrasts disappear silently.
        run: python scripts/contrast_baseline.py --check
      - name: Check NOTICE matches the provenance manifests
        run: python scripts/generate_notice.py --check
      - name: Check coverage of real CLDF data
        # Every other guard checks the library against itself and passes on a
        # library that is internally perfect and unusable on the field's data.
        # This one fails if merkmal reads less of Lexibank than it used to.
        run: python bench/bench_coverage.py --check
      - name: Check golden fixtures match the build
        # Every fixture, geometry included, is produced here through the
        # installed wrapper; the C tests only replay them. This job needs no
        # CMake build.
        run: python scripts/regenerate_golden.py --check
      - name: Build source distribution and wheel
        run: MERKMAL_REQUIRE_UTF8PROC=1 python -m build --sdist --wheel
      - name: Install source distribution
        run: python -m pip install --force-reinstall dist/merkmal-*.tar.gz
      - name: Test source distribution
        run: python -m pytest python/tests -q
      - name: Lint maintained Python code
        run: python -m ruff check python/merkmal python/tests scripts tools bench setup.py
      - name: Type-check maintained Python code
        run: python -m mypy python/merkmal

  python-sanitizer:
    name: Python extension under ASan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libutf8proc-dev
      - name: Build the extension with AddressSanitizer
        run: MERKMAL_SANITIZE=address python -m pip install -e ".[dev]" --no-build-isolation
      - name: Test
        # CPython is not built with ASan, so its runtime is preloaded. The
        # suppression file covers the four interpreter type allocations that
        # live for the process; see the file for what this does and does not
        # prove about leaks.
        run: |
          LD_PRELOAD=$(gcc -print-file-name=libasan.so.8) \
          LSAN_OPTIONS=suppressions=python/tests/lsan-suppressions.txt \
            python -m pytest python/tests -q

  wasm:
    name: WebAssembly smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node smoke test
        run: tests/wasm/run_node_smoke.sh
